      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      align-self: flex-end;
      height: 40px;
    }
    .btn-submit:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    .form-msg {
      margin-top: 10px;
      font-size: 13px;
      display: none;
    }
    .form-msg.error {
      display: block;
      color: #ff6b6b;
    }
    .form-msg.success {
      display: block;
      color: #2ecc71;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }
    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th {
      color: #aaa;
      font-weight: 600;
    }
    .badge {

      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.active {
      background-color: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      border: 1px solid #2ecc71;
    }
    .badge.suspended, .badge.inactive {
      background-color: rgba(229, 9, 20, 0.2);
      color: #ff6b6b;
      border: 1px solid #E50914;
    }
    .btn-action {
      background: none;
      border: 1px solid #777;
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-action:hover {
      border-color: #fff;
    }
    #loadingMsg {
      color: #888;
      font-style: italic;
      margin: 15px 0;
    }
  </style>
</head>
