<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mile Streaming - Panel Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #141414; color: #fff; padding: 15px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #333; max-width: 800px; margin: 0 auto; }
    .brand { color: #E50914; font-size: 20px; font-weight: bold; }
    .btn-out { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .container { max-width: 800px; margin: 20px auto; }
    .card { background: rgba(0,0,0,0.7); border: 1px solid #2b2b2b; border-radius: 8px; padding: 15px; margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; }
    .btn-red { background: #E50914; color: #fff; border: none; padding: 10px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }
    .btn-red:disabled { background: #555; }
    .msg { margin-top: 10px; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
    th { color: #888; }
    .active { color: #2ecc71; font-weight: bold; }
    .suspended { color: #e74c3c; font-weight: bold; }
    .btn-act { background: #222; border: 1px solid #666; color: #fff; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">MILE STREAMING</div>
    <button id="logoutBtn" class="btn-out">Cerrar sesión</button>
  </header>

  <div class="container">
    <div class="card">
      <h2>Panel de Administración</h2>
      <p style="color:#aaa;">Sesión iniciada como: <span id="adminEmail" style="color:#2ecc71; font-weight:bold;">Verificando...</span></p>
    </div>

    <div class="card">
      <h2>Registrar Nuevo Cliente</h2>
      <form id="createForm">
        <div class="form-group">
          <label>Usuario</label>
          <input type="text" id="newUser" placeholder="ej: cliente02" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="newPass" placeholder="Mínimo 6 caracteres" required>
        </div>
        <button type="submit" id="createBtn" class="btn-red">Crear Cliente</button>
        <div id="createMsg" class="msg"></div>
      </form>
    </div>

    <div class="card">
      <h2>Gestión de Usuarios</h2>
      <p id="loadMsg" style="color:#aaa;">Cargando lista...</p>
      <div style="overflow-x:auto;">
        <table id="userTable" style="display:none;">
          <thead>
            <tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Acción</th></tr>
          </thead>
          <tbody id="userList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = "https://procahwmwavkrbhycbbr.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByb2NhaHdtd2F2a3JiaHljYmJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMTY5NjksImV4cCI6MjEwOTY5Mjk2OX0.N2gYjyuWfZ13wZlCfe3SlET01KkRDEibxHNbR9j1kAQ";
    const client = supabase.createClient(SB_URL, SB_KEY);
    const signupClient = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });

    async function cargarPanel() {
      const { data: { session } } = await client.auth.getSession();
      if (!session) {
        document.getElementById("adminEmail").innerText = "Sin sesión. Redirigiendo...";
        setTimeout(() => window.location.href = "index.html", 1500);
        return;
      }
      document.getElementById("adminEmail").innerText = session.user.email;

      const { data: profiles, error } = await client.from("profiles").select("id, username, role, status");
      const loadMsg = document.getElementById("loadMsg");
      if (error) {
        loadMsg.innerText = "Error: " + error.message;
        return;
      }
      loadMsg.style.display = "none";
      const table = document.getElementById("userTable");
      const tbody = document.getElementById("userList");
      table.style.display = "table";
      tbody.innerHTML = "";

      profiles.forEach(p => {
        const tr = document.createElement("tr");
        const next = p.status === "active" ? "suspended" : "active";
        const btnText = p.status === "active" ? "Suspender" : "Activar";
        tr.innerHTML = `
          <td>${p.username || "Sin usuario"}</td>
          <td>${p.role}</td>
          <td class="${p.status}">${p.status}</td>
          <td>${p.role !== 'admin' ? `<button class="btn-act" onclick="cambiarEstado('${p.id}', '${next}')">${btnText}</button>` : '-'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function cambiarEstado(id, nuevo) {
      await client.from("profiles").update({ status: nuevo }).eq("id", id);
      cargarPanel();
    }

    document.getElementById("createForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const u = document.getElementById("newUser").value.trim();
      const p = document.getElementById("newPass").value;
      const msg = document.getElementById("createMsg");
      const btn = document.getElementById("createBtn");
      btn.disabled = true;
      msg.innerText = "Creando...";
      const email = u.includes("@") ? u : `${u}@milestreaming.internal`;

      try {
        const { data, error } = await signupClient.auth.signUp({ email, password: p });
        if (error) throw error;
        await client.from("profiles").upsert({ id: data.user.id, username: u, role: "customer", status: "active" });
        msg.style.color = "#2ecc71";
        msg.innerText = "¡Usuario creado!";
        document.getElementById("createForm").reset();
        cargarPanel();
      } catch (err) {
        msg.style.color = "#e74c3c";
        msg.innerText = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "index.html";
    });

    cargarPanel();
  </script>
</body>
</html>
