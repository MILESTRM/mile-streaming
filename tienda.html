<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Oficial</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    body { background-color: #141414; color: #fff; min-height: 100vh; padding-bottom: 60px; }
    header { background: #000; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b2b2b; position: sticky; top: 0; z-index: 100; }
    .brand { color: #E50914; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
    .btn-login { background: #E50914; color: #fff; text-decoration: none; padding: 7px 14px; border-radius: 4px; font-size: 13px; font-weight: bold; }
    .hero { text-align: center; padding: 40px 20px 25px; background: linear-gradient(180deg, rgba(229,9,20,0.18) 0%, rgba(20,20,20,0) 100%); }
    .hero h1 { font-size: 26px; margin-bottom: 8px; }
    .hero p { color: #aaa; font-size: 14px; }
    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: #1c1c1c; border: 1px solid #2e2e2e; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 160px; object-fit: cover; background: #2a2a2a; }
    .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .badge { display: inline-block; font-size: 11px; color: #E50914; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
    .card-title { font-size: 18px; margin-bottom: 8px; }
    .card-desc { font-size: 13px; color: #999; line-height: 1.4; margin-bottom: 15px; }
    .price { font-size: 22px; font-weight: bold; color: #2ecc71; margin-bottom: 15px; }
    .btn-buy { display: flex; align-items: center; justify-content: center; gap: 8px; background: #25D366; color: #fff; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 14px; }
    .btn-buy:hover { background: #1ebc59; }
  </style>
</head>
<body>
  <header>
    <div class="brand" id="storeName">MILE STREAMING</div>
    <a href="index.html" class="btn-login">Ingresar</a>
  </header>

  <div class="hero">
    <h1 id="heroTitle">Catálogo de Productos</h1>
    <p>Pedí tu servicio directo por WhatsApp con activación inmediata</p>
  </div>

  <div class="container">
    <div id="loading" style="text-align:center; color:#888;">Cargando catálogo...</div>
    <div id="productGrid" class="grid" style="display:none;"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://procahwmwavkrbhycbbr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByb2NhaHdtd2F2a3JiaHljYmJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMTY5NjksImV4cCI6MjEwOTY5Mjk2OX0.N2gYjyuWfZ13wZlCfe3SlET01KkRDEibxHNbR9j1kAQ";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Número por defecto si un producto no tiene vendedor asignado
    const DEFAULT_PHONE = "5493624110890";

    async function loadStore() {
      const urlParams = new URLSearchParams(window.location.search);
      const userParam = urlParams.get('user');

      let query = client.from('products').select('*');

      if (userParam) {
        // Buscar el ID del vendedor por su nombre de usuario
        const { data: profile } = await client
          .from('profiles')
          .select('id, username')
          .eq('username', userParam)
          .single();

        if (profile) {
          query = query.eq('user_id', profile.id);
          document.getElementById('storeName').innerText = `TIENDA DE ${profile.username.toUpperCase()}`;
          document.getElementById('heroTitle').innerText = `Planes de ${profile.username}`;
        }
      }

      const { data: products, error } = await query.order('created_at', { ascending: false });

      document.getElementById('loading').style.display = 'none';
      const grid = document.getElementById('productGrid');
      grid.style.display = 'grid';

      if (error || !products || products.length === 0) {
        grid.innerHTML = '<p style="color:#aaa; text-align:center; grid-column:1/-1;">No hay productos publicados por este vendedor.</p>';
        return;
      }

      grid.innerHTML = products.map(p => {
        const phone = p.seller_whatsapp || DEFAULT_PHONE;
        const msg = encodeURIComponent(`Hola! Quiero comprar "${p.name}" por $${p.price}. ¿Cómo realizo el pago?`);
        const wpLink = `https://wa.me/${phone}?text=${msg}`;

        return `
          <div class="card">
            ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : ''}
            <div class="card-body">
              <div>
                <span class="badge">${p.category || 'Servicio'}</span>
                <h3 class="card-title">${p.name}</h3>
                <p class="card-desc">${p.description || ''}</p>
              </div>
              <div>
                <div class="price">$${p.price}</div>
                <a href="${wpLink}" target="_blank" class="btn-buy">Pedir por WhatsApp 📲</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    loadStore();
  </script>
</body>
</html>
