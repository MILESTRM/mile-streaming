    .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: #1c1c1c;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #444;
    }
    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #2a2a2a;
    }
    .card-body { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .badge {
      display: inline-block;
      font-size: 11px;
      color: #E50914;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .card-title { font-size: 18px; margin-bottom: 8px; }
    .card-desc { font-size: 13px; color: #999; line-height: 1.4; margin-bottom: 15px; }
    .price { font-size: 22px; font-weight: bold; color: #2ecc71; margin-bottom: 15px; }

    .btn-buy {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-buy:hover { background: #1ebc59; }
  </style>
