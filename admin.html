<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mile Streaming - Panel Admin</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #141414;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #333;
      max-width: 900px;
      margin: 0 auto;
    }
    .brand-title {
      color: #E50914;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .btn-logout {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
    }
    .card {
      background-color: rgba(0, 0, 0, 0.75);
      border: 1px solid #2b2b2b;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #fff;
    }
    .admin-info {
      color: #aaa;
      font-size: 14px;
    }
    .admin-info span {
      color: #2ecc71;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }
    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th {
      color: #aaa;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.active {
      background-color: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      border: 1px solid #2ecc71;
    }
    .badge.suspended, .badge.inactive {
      background-color: rgba(229, 9, 20, 0.2);
      color: #ff6b6b;
      border: 1px solid #E50914;
    }
    .btn-action {
      background: none;
      border: 1px solid #777;
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-action:hover {
      border-color: #fff;
    }
    #loadingMsg {
      color: #888;
      font-style: italic;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">MILE STREAMING</div>
    <button id="logoutBtn" class="btn-logout">Cerrar sesión</button>
  </header>

  <div class="container">
    <div class="card">
      <h2>Panel de Administración</h2>
      <p class="admin-info">Sesión iniciada como: <span id="adminEmail">Verificando...</span></p>
    </div>

    <div class="card">
      <h2>Gestión de Usuarios</h2>
      <p id="loadingMsg">Cargando cuentas...</p>
      <div style="overflow-x: auto;">
        <table id="usersTable" style="display: none;">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="usersList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://procahwmwavkrbhycbbr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByb2NhaHdtd2F2a3JiaHljYmJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMTY5NjksImV4cCI6MjEwOTY5Mjk2OX0.N2gYjyuWfZ13wZlCfe3SlET01KkRDEibxHNbR9j1kAQ";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function initAdmin() {
      const emailElem = document.getElementById("adminEmail");
      const loadMsg = document.getElementById("loadingMsg");

      const { data: { user }, error: userErr } = await client.auth.getUser();

      if (userErr || !user) {
        emailElem.textContent = "No autenticado. Redirigiendo...";
        setTimeout(() => { window.location.href = "index.html"; }, 1500);
        return;
      }

      emailElem.textContent = user.email;

      // Cargar perfiles sin ordenar por columnas inexistentes
      const { data: profiles, error: profErr } = await client
        .from("profiles")
        .select("id, username, role, status");

      if (profErr) {
        loadMsg.style.color = "#ff6b6b";
        loadMsg.textContent = "Error de Supabase: " + profErr.message;
        return;
      }

      if (!profiles || profiles.length === 0) {
        loadMsg.textContent = "No hay perfiles registrados en la tabla.";
        return;
      }

      loadMsg.style.display = "none";
      const table = document.getElementById("usersTable");
      const tbody = document.getElementById("usersList");
      table.style.display = "table";
      tbody.innerHTML = "";

      profiles.forEach(p => {
        const tr = document.createElement("tr");
        const statusClass = p.status === "active" ? "active" : "suspended";
        const nextStatus = p.status === "active" ? "suspended" : "active";
        const actionLabel = p.status === "active" ? "Suspender" : "Activar";

        tr.innerHTML = `
          <td>${p.username || "Sin usuario"}</td>
          <td>${p.role || "customer"}</td>
          <td><span class="badge ${statusClass}">${p.status || "inactivo"}</span></td>
          <td>
            ${p.role !== 'admin' ? `
              <button class="btn-action" onclick="toggleUserStatus('${p.id}', '${nextStatus}')">
                ${actionLabel}
              </button>
            ` : '<span style="color:#777;">Admin</span>'}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function toggleUserStatus(id, newStatus) {
      const { error } = await client
        .from("profiles")
        .update({ status: newStatus })
        .eq("id", id);

      if (error) {
        alert("Error al actualizar: " + error.message);
      } else {
        initAdmin();
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "index.html";
    });

    initAdmin();
  </script>
</body>
</html>
