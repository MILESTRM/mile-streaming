<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mile Streaming</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #141414;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .header {
      width: 100%;
      max-width: 420px;
      margin-bottom: 25px;
      text-align: left;
    }
    .brand-title {
      color: #E50914;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .login-card {
      background-color: rgba(0, 0, 0, 0.75);
      border: 1px solid #2b2b2b;
      border-radius: 8px;
      padding: 30px 24px;
      width: 100%;
      max-width: 420px;
    }
    .login-card h2 {
      font-size: 22px;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #b3b3b3;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #333333;
      background-color: #333333;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #E50914;
      background-color: #444444;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background-color: #E50914;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-login:active {
      background-color: #b80710;
    }
    .footer-note {
      margin-top: 25px;
      color: #737373;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="brand-title">MILE STREAMING</h1>
  </div>

  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Ingresá tu usuario" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresá tu contraseña" required>
      </div>

      <button type="submit" class="btn-login">Ingresar</button>
    </form>
  </div>

  <div class="footer-note">
    Acceso exclusivo para clientes autorizados
  </div>

</body>
</html>
