<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Mile Streaming</title>
  <style>
    body {
      background-color: #141414;
      color: #ffffff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #333;
    }
    h1 {
      color: #E50914;
      margin: 0;
      font-size: 24px;
    }
    .btn-logout {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 14px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .movie-card {
      background-color: #222;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
    }
    .movie-poster {
      width: 100%;
      height: 250px;
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 14px;
    }
    .movie-info {
      padding: 12px;
    }
    .movie-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .btn-play {
      display: block;
      text-align: center;
      background-color: #E50914;
      color: white;
      text-decoration: none;
      padding: 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>MILE STREAMING</h1>
    <a href="index.html" class="btn-logout">Cerrar sesión</a>
  </header>

  <h2 style="margin-top: 25px; font-size: 20px;">Títulos disponibles</h2>
  
  <div class="grid">
    <div class="movie-card">
      <div class="movie-poster">Vista Previa</div>
      <div class="movie-info">
        <div class="movie-title">Canal / Contenido Demo</div>
        <a href="#" class="btn-play">Reproducir</a>
      </div>
    </div>
  </div>
</body>
</html>
