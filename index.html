<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mile Streaming</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #141414;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .header {
      width: 100%;
      max-width: 420px;
      margin-bottom: 25px;
      text-align: left;
    }
    .brand-title {
      color: #E50914;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .login-card {
      background-color: rgba(0, 0, 0, 0.75);
      border: 1px solid #2b2b2b;
      border-radius: 8px;
      padding: 30px 24px;
      width: 100%;
      max-width: 420px;
    }
    .login-card h2 {
      font-size: 22px;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #b3b3b3;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #333333;
      background-color: #333333;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #E50914;
      background-color: #444444;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background-color: #E50914;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-login:disabled {
      background-color: #555555;
      cursor: not-allowed;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
      text-align: center;
    }
    .message.error {
      display: block;
      background-color: rgba(229, 9, 20, 0.2);
      border: 1px solid #E50914;
      color: #ff6b6b;
    }
    .message.success {
      display: block;
      background-color: rgba(46, 204, 113, 0.2);
      border: 1px solid #2ecc71;
      color: #2ecc71;
    }
    .footer-note {
      margin-top: 25px;
      color: #737373;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 class="brand-title">MILE STREAMING</h1>
  </div>

  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Ingresá tu usuario" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresá tu contraseña" required autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="btn-login">Ingresar</button>
      <div id="statusMessage" class="message"></div>
    </form>
  </div>

  <div class="footer-note">
    Acceso exclusivo para clientes autorizados
  </div>

  <script>
    const SUPABASE_URL = "https://procahwmwavkrbhycbbr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByb2NhaHdtd2F2a3JiaHljYmJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMTY5NjksImV4cCI6MjEwOTY5Mjk2OX0.N2gYjyuWfZ13wZlCfe3SlET01KkRDEibxHNbR9j1kAQ";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("loginForm");
    const msg = document.getElementById("statusMessage");
    const btn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "message";
      msg.textContent = "";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.textContent = "Verificando...";

      try {
        const email = username.includes("@") ? username : `${username}@milestreaming.internal`;

        const { data, error } = await client.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          throw error;
        }

        const { data: profile, error: profileErr } = await client
          .from("profiles")
          .select("username, role, status")
          .eq("id", data.user.id)
          .single();

        if (profileErr) {
          throw new Error("No se pudo obtener el perfil del usuario.");
        }

        if (profile.status !== "active") {
          await client.auth.signOut();
          throw new Error("Esta cuenta se encuentra inactiva o suspendida.");
        }

        msg.className = "message success";
        msg.textContent = `¡Bienvenido ${profile.username}! Rol: ${profile.role}`;

        setTimeout(() => {
          if (profile.role === "admin") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "catalog.html";
          }
        }, 1200);

      } catch (err) {
        msg.className = "message error";
        msg.textContent = err.message || "Usuario o contraseña incorrectos.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>
