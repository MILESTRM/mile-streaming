<html lang="es">

    * {

      padding: 0;

    }
    body {
      background-color: #141414;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }
    header {

      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #333;
      max-width: 900px;
      margin: 0 auto;
    }
    .brand-title {
      color: #E50914;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .btn-logout {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 14px;

      border: 1px solid #2b2b2b;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }
    h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #fff;
    }
    .admin-info {
      color: #aaa;
      font-size: 14px;
    }
    .admin-info span {
      color: #2ecc71;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }
    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #333;
    }
    th {
      color: #aaa;
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge.active {
      background-color: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      border: 1px solid #2ecc71;
    }
    .badge.inactive, .badge.suspended {
      background-color: rgba(229, 9, 20, 0.2);
      color: #ff6b6b;
      border: 1px solid #E50914;
    }
    .btn-action {
      background: none;
      border: 1px solid #777;
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-action:hover {
      border-color: #fff;
    }
    #loadingMsg {
      color: #888;
      font-style: italic;
      margin: 15px 0;
    }
  </style>
</head>

    <div class="card">

      <p id="loadingMsg">Cargando cuentas...</p>
      <div style="overflow-x: auto;">
        <table id="usersTable" style="display: none;">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="usersList"></tbody>
        </table>
      </div>
    </div>
  </div>
